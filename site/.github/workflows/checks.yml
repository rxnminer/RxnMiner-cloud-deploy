name: Submission checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: RxnMiner/harness/requirements-local.txt
      - run: pip install -r RxnMiner/harness/requirements-local.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:recognition
      - run: python3 scripts/audit_release.py
