name: Build demo image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/rxnminer/rxnminer-cloud-deploy:demo-v4
      - name: Check running demo
        run: |
          docker run -d --name smoke -p 18840:18840 ghcr.io/rxnminer/rxnminer-cloud-deploy:demo-v4
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18840/api/demo/health > /tmp/health.json; then break; fi
            sleep 2
          done
          python -c 'import json; assert json.load(open("/tmp/health.json"))["liveAvailable"]'
          curl -fsS http://127.0.0.1:18840/try/ > /tmp/demo.html
          docker exec smoke /opt/venv/bin/python -c 'from rdkit import Chem; from uniparser_tools.api.clients import UniParserClient; assert Chem.MolFromSmiles("CCO")'
      - name: Push tested image
        run: docker push ghcr.io/rxnminer/rxnminer-cloud-deploy:demo-v4
